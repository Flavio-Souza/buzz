global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    deployment: buzz-vps

scrape_configs:
  - job_name: buzz-relay
    metrics_path: /metrics
    static_configs:
      - targets:
          - relay:9102
        labels:
          service: buzz-relay

  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090
